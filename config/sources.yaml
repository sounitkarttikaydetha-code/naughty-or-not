check_interval_hours: 24
sources:
- id: us_ofac
  authority: US Department of the Treasury (OFAC)
  landing_page: https://ofac.treasury.gov/specially-designated-nationals-and-blocked-persons-list-sdn-human-readable-lists
  candidate_urls:
  - https://sanctionslistservice.ofac.treas.gov/api/publicationpreview/exports/sdn.csv
  - https://www.treasury.gov/ofac/downloads/sdn.csv
  allowed_domains:
  - treasury.gov
  - ofac.treasury.gov
  - sanctionssearch.ofac.treas.gov
  - sanctionslistservice.ofac.treas.gov
  - s3.us-gov-west-1.amazonaws.com
  - amazonaws.com
  discovery: href=[\"'](/?(?:https?://[^\"']*/|ofac/downloads/|Files/)sdn\.csv)[\"']
  expected:
    format: csv
    min_bytes: 5000000
    required_columns:
    - ent_num
    - SDN_Name
    - SDN_Type
    - Program
    min_records: 15000
    count_range_ratio:
    - 0.7
    - 1.5
  max_age_days: 7
  closure_keywords:
  - no longer being updated
  - has closed
  - closed on
  - replaced by
  - superseded
  - withdrawn
  - archived
  - discontinued
  - moved to
  verify_url: https://sanctionssearch.ofac.treas.gov/
  record_url_template: https://sanctionssearch.ofac.treas.gov/Details.aspx?id={id}

