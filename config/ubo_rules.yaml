# Clearance Check v1.1.1 - Beneficial Ownership & Control Rules Configuration
# Encodes multilateral sanctions 50% rules, diligence triggers, and control criteria:
# - Adani Airports Sanctions Compliance SOP (20% Diligence Trigger)
# - Indian Beneficial Owner Threshold (10% Marker)
# - US OFAC 50% Rule (FAQs 399, 401 Examples 1-3)
# - EU 50% Rule (>=50.0% ownership or control criteria)
# - UK Sanctions Regulations (>50.0% shares/votes or board majority/control)

diligence_trigger_pct: 20.0
india_bo_marker_pct: 10.0

ofac:
  threshold_percent: 50.0
  operator: ">="
  rule_description: "An entity is blocked if owned 50% or more in the aggregate, directly or indirectly, by one or more blocked persons."
  aggregate_blocked_persons: true
  indirect_multi_tier: "blocked_subsidiary_pass_through"
  non_blocked_intermediate_pass_through: false
  authority: "US Department of the Treasury (OFAC)"
  faqs_reference: "OFAC FAQs 399, 401"
  verdict_met: "Sanctions ownership criteria met (US OFAC 50% Rule)"
  verdict_not_met: "No sanctions ownership or control criteria met based on disclosed data (US OFAC)"

eu:
  threshold_percent: 50.0
  operator: ">="
  rule_description: "An entity is subject to asset freeze if owned 50% or more by a designated person, or controlled by a designated person."
  aggregation_default: true
  aggregation_assumption_note: "Evaluated with aggregation of designated owners (EU Commission Guidance conservative default)."
  control_criteria:
    - "right_to_appoint_majority_board"
    - "decisive_influence"
    - "holding_majority_voting_rights"
    - "power_to_exercise_dominant_influence"
  authority: "European Commission (DG FISMA) / Council Regulations"
  verdict_met: "Sanctions ownership or control criteria met (EU Council Regulations)"
  verdict_not_met: "No sanctions ownership or control criteria met based on disclosed data (EU)"

uk:
  threshold_percent: 50.0
  operator: ">"
  rule_description: "An entity is owned or controlled if a designated person holds more than 50% of shares or voting rights, or has the right to appoint/remove majority of directors, or conducts affairs per wishes."
  aggregation_default: false
  show_conservative_aggregate_alongside: true
  conditions:
    condition_1: "holds_more_than_50_pct_shares_or_votes"
    condition_2: "right_to_appoint_or_remove_majority_of_directors"
    condition_3: "significant_control_or_conducts_affairs_per_wishes"
  authority: "UK Foreign, Commonwealth & Development Office (FCDO) / OFSI"
  verdict_met: "Sanctions ownership or control criteria met (UK Sanctions Regulations)"
  verdict_not_met: "No sanctions ownership or control criteria met based on disclosed data (UK)"

un_mha:
  flag_any_listed_owner: true
  flag_any_listed_key_person: true
  authority: "UN Security Council / India Ministry of Home Affairs (MHA)"

bis_affiliates:
  entity_list_threshold_pct: 50.0
  flag_label: "verify current rule"
  authority: "US Bureau of Industry and Security (BIS)"

review_schedule:
  standard_months: 12
  high_risk_months: 6

workflow:
  four_eyes_required: true
  disposition_statuses:
    - "Unresolved"
    - "Confirmed match"
    - "False positive"
  review_statuses:
    - "Draft"
    - "Submitted"
    - "Reviewed"
    - "Closed"
    - "Escalated"
