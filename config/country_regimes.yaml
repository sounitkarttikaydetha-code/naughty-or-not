# Country Sanctions, Export Control & Regulatory Regimes (T11 Part J / v1.1.2)
# Comprehensive and selective regimes across US OFAC, UK FCDO, European Commission (DG FISMA), UN Security Council,
# ITAR 22 CFR 126.1, and EAR Country Groups.
# Verified with official government sources.

metadata:
  version: "1.1.2"
  last_updated: "2026-10-27"
  authority: "Multilateral Sanctions & Export-Control Regimes"

regimes:
  CU:
    country: "Cuba"
    aliases: ["cuba", "republic of cuba", "cuban"]
    flag: "🇨🇺"
    risk_level: "HIGH"
    verification_date: "2026-10-27"
    source_url: "https://ofac.treasury.gov/sanctions-programs-and-country-information/cuba-sanctions"
    us_sanctions:
      type: "Comprehensive Embargo"
      authority: "OFAC 31 CFR Part 515 (CACR)"
      source_url: "https://ofac.treasury.gov/sanctions-programs-and-country-information/cuba-sanctions"
      summary: "Broad commercial, financial, and trade embargo. All property and interests in property blocked."
    uk_sanctions:
      type: "None"
      source_url: "https://www.gov.uk/government/collections/uk-sanctions-regimes"
      summary: "No UK autonomous unilateral embargo."
    eu_sanctions:
      type: "None"
      source_url: "https://www.sanctionsmap.eu/#/main"
      summary: "No EU autonomous embargo; EU Blocking Statute applies."
    un_sanctions:
      type: "None"
      source_url: "https://www.un.org/securitycouncil/sanctions/information"
      summary: "No UN Security Council sanctions."
    export_controls:
      source_url: "https://www.bis.doc.gov/index.php/regulations/commerce-control-list-ccl"
      us_ear: "Group E:2 (Unilateral Embargo) & Group E:1 (Terrorist Supporting)"
      us_itar: "22 CFR 126.1 Prohibited Destination"

  IR:
    country: "Iran"
    aliases: ["iran", "islamic republic of iran", "iranian"]
    flag: "🇮🇷"
