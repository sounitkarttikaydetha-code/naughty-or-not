    us_sanctions:
      type: "Comprehensive Embargo"
      authority: "OFAC 31 CFR Part 560 (ITSR)"
      source_url: "https://ofac.treasury.gov/sanctions-programs-and-country-information/iran-sanctions"
      summary: "Comprehensive commercial and financial embargo. Secondary sanctions apply to non-US persons."
    uk_sanctions:
      type: "Comprehensive Financial & Strategic Export Sanctions"
      authority: "FCDO Iran (Sanctions) (Nuclear) (EU Exit) Regulations 2019"
      source_url: "https://www.gov.uk/government/publications/financial-sanctions-iran-nuclear"
      summary: "Asset freezes, targeted export prohibitions, ballistic missile / nuclear proliferation controls."
    eu_sanctions:
      type: "Restrictive Measures"
      authority: "Council Regulation (EU) No 267/2012"
      source_url: "https://www.sanctionsmap.eu/#/main?regime=IRN"
      summary: "Asset freezes, financial restrictions, and arms / proliferation embargoes."
    un_sanctions:
      type: "UNSC Resolution 2231"
      source_url: "https://www.un.org/securitycouncil/content/2231/background"
      summary: "Targeted asset freezes, arms transfer restrictions, and proliferation bans."
    export_controls:
      source_url: "https://www.bis.doc.gov/index.php/regulations/commerce-control-list-ccl"
      us_ear: "Group E:1 & E:2 (Comprehensive Embargo)"
      us_itar: "22 CFR 126.1 Prohibited Destination"

  KP:
    country: "North Korea"
    aliases: ["north korea", "dprk", "democratic people's republic of korea", "korea, democratic people's republic of"]
    flag: "🇰🇵"
    risk_level: "HIGH"
    verification_date: "2026-10-27"
    source_url: "https://ofac.treasury.gov/sanctions-programs-and-country-information/north-korea-sanctions"
    us_sanctions:
      type: "Comprehensive Embargo"
      authority: "OFAC 31 CFR Part 510 (NKSR)"
      source_url: "https://ofac.treasury.gov/sanctions-programs-and-country-information/north-korea-sanctions"
      summary: "Strict comprehensive embargo, asset freeze on government and Workers' Party, secondary sanctions."
    uk_sanctions:
      type: "Autonomous & UN Sanctions"
      authority: "FCDO Democratic People's Republic of Korea (Sanctions) (EU Exit) Regulations 2019"
      source_url: "https://www.gov.uk/government/publications/financial-sanctions-democratic-peoples-republic-of-korea"
      summary: "Comprehensive trade, financial, transportation, and bunkering prohibitions."
    eu_sanctions:
      type: "Restrictive Measures"
      authority: "Council Regulation (EU) 2017/1509"
      source_url: "https://www.sanctionsmap.eu/#/main?regime=PRK"
      summary: "Far-reaching sectoral sanctions on finance, trade, investment, and transport."
    un_sanctions:
      type: "UNSC Resolutions 1718, 1874, 2087, 2094, 2270, 2321, 2371, 2375, 2397"
      source_url: "https://www.un.org/securitycouncil/sanctions/1718"
      summary: "Full sectoral embargo on coal, iron, textiles, seafood; caps on refined petroleum; ban on joint ventures."
    export_controls:
      source_url: "https://www.bis.doc.gov/index.php/regulations/commerce-control-list-ccl"
      us_ear: "Group E:1 & E:2 (Comprehensive Embargo)"
      us_itar: "22 CFR 126.1 Prohibited Destination"

  SY:
    country: "Syria"
    aliases: ["syria", "syrian arab republic", "syrian"]
    flag: "🇸🇾"
    risk_level: "HIGH"
    verification_date: "2026-10-27"
    source_url: "https://ofac.treasury.gov/sanctions-programs-and-country-information/syria-sanctions"
    us_sanctions:
      type: "Targeted Sanctions (PAARSS) & Selective Authority"
      authority: "E.O. 14312 (effective 1 July 2025) & Promoting Accountability for Assad and Regional Stabilization Sanctions (PAARSS)"
      source_url: "https://ofac.treasury.gov/sanctions-programs-and-country-information/syria-sanctions"
      summary: "US Syria comprehensive trade and investment embargo revoked effective 1 July 2025 pursuant to E.O. 14312. Note: 31 CFR Part 542 was removed from the CFR on 26 Aug 2025. Targeted authority continues under Promoting Accountability for Assad and Regional Stabilization Sanctions (PAARSS). Hayat Tahrir al-Sham was removed from the SDGT designation on 24 Aug 2026, and Syria's State Sponsor of Terrorism designation was rescinded on 24 Aug 2026 (OFAC FAQ 1220)."
    uk_sanctions:
      type: "Autonomous Sanctions"
      authority: "FCDO Syria (Sanctions) (EU Exit) Regulations 2019"
      source_url: "https://www.gov.uk/government/publications/financial-sanctions-syria"
      summary: "Targeted asset freezes, trade embargo on crude oil/petroleum, luxury goods, dual-use items."
    eu_sanctions:
      type: "Restrictive Measures"
      authority: "Council Regulation (EU) No 36/2012"
      source_url: "https://www.sanctionsmap.eu/#/main?regime=SYR"
      summary: "Oil embargo, export restrictions on dual-use items, asset freezes on central bank and officials."
    un_sanctions:
      type: "Targeted (Selected Entities)"
      source_url: "https://www.un.org/securitycouncil/sanctions/information"
      summary: "Targeted counter-terrorism measures."
    export_controls:
      source_url: "https://www.bis.doc.gov/index.php/regulations/commerce-control-list-ccl"
      us_ear: "Group E:1 & E:2 (ITAR and EAR specific restrictions apply)"
      us_itar: "22 CFR 126.1 Prohibited Destination"

  RU:
    country: "Russia"
    aliases: ["russia", "russian federation", "russian"]
    flag: "🇷🇺"
    risk_level: "HIGH"
    verification_date: "2026-10-27"
    source_url: "https://ofac.treasury.gov/sanctions-programs-and-country-information/russian-sanctions"
    us_sanctions:
      type: "Selective (Extensive) & Territorial Embargoes"
      authority: "OFAC EO 14024, EO 14066, EO 14068, EO 14071 (RuHSR)"
      source_url: "https://ofac.treasury.gov/sanctions-programs-and-country-information/russian-sanctions"
      summary: "Selective (extensive), not countrywide blanket embargo; comprehensive territorial embargoes on Crimea (E.O. 13685) and so-called DNR (Donetsk) and LNR (Luhansk) regions of Ukraine (E.O. 14065). Note on Ukraine regions: Kherson and Zaporizhzhia are Unverified — not shown as US comprehensive without official Treasury determination. Broad sectoral prohibitions on finance, sovereign debt, energy, accounting, IT/software services. Maritime crude price cap."
    uk_sanctions:
      type: "Autonomous Sanctions"
      authority: "FCDO Russia (Sanctions) (EU Exit) Regulations 2019"
      source_url: "https://www.gov.uk/government/publications/financial-sanctions-russia"
      summary: "Far-reaching asset freezes, financial prohibitions, trade bans on critical goods/technology, energy, transport bans."
    eu_sanctions:
      type: "Restrictive Measures (Packages 1-14+)"
      authority: "Council Regulation (EU) No 833/2014, (EU) No 269/2014 & Council Regulation (EU) 2022/263"
      source_url: "https://www.sanctionsmap.eu/#/main?regime=RUS"
      summary: "SWIFT exclusions, import bans on crude/coal/steel/gold, export bans on dual-use tech. Council Regulation (EU) 2022/263 covers non-government-controlled areas of Donetsk, Kherson, Luhansk, and Zaporizhzhia oblasts of Ukraine. Crimea and Sevastopol are covered by separate regime (Council Regulation (EU) No 692/2014)."
    un_sanctions:
      type: "None"
      source_url: "https://www.un.org/securitycouncil/sanctions/information"
      summary: "No UN Security Council sanctions (veto member)."
    export_controls:
      source_url: "https://www.bis.doc.gov/index.php/regulations/commerce-control-list-ccl"
      us_ear: "Country Group D:1, D:5; Extensive EAR Part 746 Section 746.5 / 746.8 restrictions (FDPR)"
      us_itar: "22 CFR 126.1 Prohibited Destination (Subject to exceptions)"

  UA_REGIONS:
    country: "Occupied Regions of Ukraine"
    aliases: [
      "crimea", "sevastopol", "donetsk", "dnr", "luhansk", "lnr",
      "kherson", "zaporizhzhia", "occupied ukraine", "donbas"
    ]
    flag: "🇺🇦"
    risk_level: "HIGH"
    verification_date: "2026-10-27"
    source_url: "https://ofac.treasury.gov/sanctions-programs-and-country-information/ukraine-russia-related-sanctions"
    us_sanctions:
      type: "Territorial Embargoes"
      authority: "E.O. 13685 (Crimea), E.O. 14065 (DNR/LNR)"
      source_url: "https://ofac.treasury.gov/sanctions-programs-and-country-information/ukraine-russia-related-sanctions"
      summary: "Comprehensive territorial embargo on Crimea region (E.O. 13685) and so-called Donetsk People's Republic (DNR) and Luhansk People's Republic (LNR) regions (E.O. 14065: 'and such other regions as may be determined'). Kherson and Zaporizhzhia: Unverified — not shown as US comprehensive without official Treasury determination."
    uk_sanctions:
      type: "Territorial Sanctions"
      authority: "Russia (Sanctions) (EU Exit) Regulations 2019 (as amended)"
      source_url: "https://www.gov.uk/government/publications/financial-sanctions-russia"
      summary: "Comprehensive trade, investment, and financial restrictions targeting Crimea, Donetsk, Luhansk, Kherson, and Zaporizhzhia non-government controlled territories."
    eu_sanctions:
      type: "Restrictive Measures"
      authority: "Council Regulation (EU) 2022/263 & Council Regulation (EU) No 692/2014"
      source_url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32022R0263"
      summary: "Council Regulation (EU) 2022/263 covers the non-government-controlled areas of the Donetsk, Kherson, Luhansk and Zaporizhzhia oblasts of Ukraine. Crimea and Sevastopol are covered by separate regime (Council Regulation (EU) No 692/2014)."
    un_sanctions:
      type: "None"
      source_url: "https://www.un.org/securitycouncil/sanctions/information"
      summary: "No UN Security Council sanctions."
    export_controls:
      source_url: "https://www.bis.doc.gov/index.php/regulations/commerce-control-list-ccl"
      us_ear: "EAR 15 CFR Part 746 Section 746.6 (Territorial sanctions on Crimea, DNR, LNR)"
      us_itar: "22 CFR 126.1 Prohibited Destination"

